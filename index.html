<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aligner: Audio Engine Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M21 3v11c0 2.2-1.8 4-4 4s-4-1.8-4-4 1.8-4 4-4c.36 0 .7.05 1 .15V7.1L9 9.3v7.7c0 2.2-1.8 4-4 4s-4-1.8-4-4 1.8-4 4-4c.36 0 .7.05 1 .15v-10l15-4z' fill='%23DF7366'/></svg>">
    <style>
        :root {
            --bg: #1A1C23;
            --card-bg: #252833;
            --coral: #DF7366;
            --white: #ffffff;
            --text-sub: #A0A2AB;
            --bar-w: 30px;
            --gap: 8px;
            
            /* Efeitos Neon */
            --neon-white: 0 0 10px rgba(255, 255, 255, 0.15), 0 0 20px rgba(255, 255, 255, 0.05);
            --neon-coral: 0 0 15px var(--coral), 0 0 30px rgba(223, 115, 102, 0.4);
            
            --smooth-curve: cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* TRAVA TOTAL DO MOUSE ORIGINAL */
        * { cursor: none !important; }

        body {
            background: var(--bg);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }

        /* CURSOR CARTOON SUPREMO */
        #custom-cursor {
            position: fixed; width: 28px; height: 28px;
            z-index: 20000001; pointer-events: none !important; 
            left: -50px; top: -50px; transition: none;
        }

        /* SIDEBAR */
        #editions-panel {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: var(--card-bg); z-index: 1000000;
            box-shadow: 20px 0 60px rgba(0,0,0,0.8);
            transition: left 0.5s var(--smooth-curve);
            padding: 40px 25px; border-right: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
        }
        #editions-panel.open { left: 0; }

        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        .close-btn { background: none; border: none; padding: 10px; }
        .close-btn svg { fill: white; width: 20px; transition: fill 0.3s; }

        .edition-item {
            padding: 20px; border-radius: 18px; background: rgba(255,255,255,0.03);
            margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s var(--smooth-curve);
            display: block; text-decoration: none;
        }
        .edition-item:hover { background: rgba(255,255,255,0.08); transform: translateX(10px); border-color: var(--coral); }
        .edition-item h4 { margin: 0; color: white; font-size: 1.1rem; }
        .edition-item p { margin: 5px 0 0; color: var(--text-sub); font-size: 0.85rem; }

        /* BLUR CONTAINER */
        #blur-container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: filter 0.5s var(--smooth-curve);
        }
        body.menu-open #blur-container { filter: blur(15px); pointer-events: none; }

        /* HEADER */
        .header { text-align: center; margin-bottom: 30px; pointer-events: none; }
        h1 { font-size: 3.5rem; margin: 0; color: white; letter-spacing: -1.5px; }
        p { color: var(--text-sub); margin: 8px 0 0; font-size: 1.15rem; }

        /* BOTÃO TRÊS PONTINHOS (BRANCO) */
        .top-ctrls { position: absolute; top: 25px; left: 25px; z-index: 2000; }
        .icon-btn {
            width: 50px; height: 50px; border-radius: 18px;
            border: 2px solid rgba(255,255,255,0.08); background: var(--card-bg);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.3s;
        }
        .icon-btn svg { fill: #ffffff !important; width: 24px; } /* Forçado para Branco Puro */

        /* CONTROLES MP3 */
        .action-slot {
            display: flex; align-items: center; justify-content: center;
            gap: 20px; margin-bottom: 50px;
        }

        .btn {
            background: var(--white); color: #000; border: none;
            padding: 12px 30px; border-radius: 25px; font-weight: 700;
            box-shadow: var(--shadow-soft); transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .pause-btn { background: var(--coral); width: 55px; height: 55px; border-radius: 50%; padding: 0; box-shadow: var(--neon-coral); }
        .pause-btn svg { fill: white; width: 22px; }

        /* VOLUME SLIDER CARTOON */
        .volume-container { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 10px 20px; border-radius: 30px; }
        input[type="range"] {
            -webkit-appearance: none; width: 100px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 5px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; background: var(--white); border-radius: 50%; border: 3px solid var(--coral); box-shadow: var(--neon-coral);
        }

        /* VISUALIZADOR NEON */
        .stage {
            display: flex; align-items: flex-end; justify-content: center;
            height: 300px; gap: var(--gap);
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .bar {
            width: var(--bar-w); background: var(--white);
            border-radius: 50px; min-height: 10px;
            box-shadow: var(--neon-white);
            transition: height 0.1s linear, background-color 0.3s, box-shadow 0.3s;
        }

        /* BARRA INFERIOR */
        .bottom-bar {
            margin-top: 50px; display: flex; align-items: center; gap: 20px;
            background: var(--card-bg); padding: 12px 30px; border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1); width: 450px;
        }
        .progress-container { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; position: relative; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--coral); width: 0%; box-shadow: 0 0 10px var(--coral); }
        #time-display { font-family: monospace; font-weight: bold; font-size: 1.1rem; color: white; min-width: 65px; text-align: right; }
    </style>
</head>
<body>

    <div id="custom-cursor">
        <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
            <path d="M4.5 3V17.5L9.2 13.3L13 21L16.5 19.3L12.8 11.7L18.5 11.5L4.5 3Z" 
                  fill="white" stroke="black" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- Top Menu -->
    <div class="top-ctrls">
        <button class="icon-btn" onclick="toggleMenu()">
            <!-- Ícone 3 pontos branco -->
            <svg viewBox="0 0 24 24"><path d="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z"/></svg>
        </button>
    </div>

    <div id="editions-panel">
        <div class="panel-header">
            <h2 style="color: white; margin: 0;">Editions</h2>
            <button class="close-btn" onclick="toggleMenu()">
                <svg viewBox="0 0 24 24"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"/></svg>
            </button>
        </div>
        <a href="https://lorodev420.github.io/Aligner-A-straightforward-and-direct-approach./" class="edition-item">
            <h4>Standard Sort</h4>
            <p>Go back to the challenge.</p>
        </a>
        <div class="edition-item active">
            <h4>Audio Engine</h4>
            <p>Neon Visualizer Active.</p>
        </div>
    </div>

    <div id="blur-container">
        <div class="header">
            <h1>Audio Engine</h1>
            <p>A straightforward and direct audio approach.</p>
        </div>

        <div class="action-slot">
            <label class="btn" style="cursor: none !important;">
                Load MP3 <input type="file" id="audio-input" accept="audio/mp3">
            </label>
            
            <button class="btn pause-btn" id="play-pause">
                <svg id="svg-pause" viewBox="0 0 24 24"><path d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>
                <svg id="svg-play" viewBox="0 0 24 24" style="display:none;"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
            </button>

            <div class="volume-container">
                <svg style="fill:white; width:18px;" viewBox="0 0 24 24"><path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.85 14,18.71V20.77C18.03,19.86 21,16.28 21,12C21,7.72 18.03,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16.02C15.5,15.29 16.5,13.77 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/></svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
            </div>
        </div>

        <div class="stage" id="stage"></div>

        <div class="bottom-bar">
            <div class="progress-container"><div class="progress-fill" id="progress-fill"></div></div>
            <div id="time-display">00:00</div>
        </div>
    </div>

    <script>
        const audioInput = document.getElementById('audio-input');
        const playPauseBtn = document.getElementById('play-pause');
        const volSlider = document.getElementById('volume-slider');
        const progressFill = document.getElementById('progress-fill');
        const timeDisplay = document.getElementById('time-display');
        const cursor = document.getElementById('custom-cursor');
        const stage = document.getElementById('stage');
        const menu = document.getElementById('editions-panel');

        let audio = new Audio();
        let audioCtx, analyser, dataArray, source, gainNode;
        let isPlaying = false;
        const numBars = 19;
        const bars = [];

        for (let i = 0; i < numBars; i++) {
            const b = document.createElement('div');
            b.className = 'bar';
            stage.appendChild(b);
            bars.push(b);
        }

        window.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        function toggleMenu() {
            const isOpen = menu.classList.toggle('open');
            document.body.classList.toggle('menu-open', isOpen);
        }

        audioInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            audio.src = URL.createObjectURL(file);
            setupAudio();
            audio.play();
            isPlaying = true;
            updateIcons();
        };

        function setupAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            gainNode = audioCtx.createGain();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            analyser.fftSize = 64;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            gainNode.gain.value = volSlider.value;
            render();
        }

        volSlider.oninput = () => { if(gainNode) gainNode.gain.value = volSlider.value; };

        playPauseBtn.onclick = () => {
            if (!audio.src) return;
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (isPlaying) audio.pause(); else audio.play();
            isPlaying = !isPlaying;
            updateIcons();
        };

        function updateIcons() {
            document.getElementById('svg-pause').style.display = isPlaying ? 'block' : 'none';
            document.getElementById('svg-play').style.display = isPlaying ? 'none' : 'block';
        }

        function render() {
            requestAnimationFrame(render);
            if (isPlaying) {
                analyser.getByteFrequencyData(dataArray);
                for (let i = 0; i < numBars; i++) {
                    let val = dataArray[i];
                    let h = (val / 255) * 280;
                    bars[i].style.height = Math.max(10, h) + 'px';
                    if (val > 200) {
                        bars[i].style.backgroundColor = 'var(--coral)';
                        bars[i].style.boxShadow = 'var(--neon-coral)';
                    } else {
                        bars[i].style.backgroundColor = 'white';
                        bars[i].style.boxShadow = 'var(--neon-white)';
                    }
                }
                const pct = (audio.currentTime / audio.duration) * 100 || 0;
                progressFill.style.width = pct + "%";
                const mins = Math.floor(audio.currentTime / 60);
                const secs = Math.floor(audio.currentTime % 60);
                timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                bars.forEach(b => { 
                    b.style.height = '10px'; 
                    b.style.backgroundColor = 'white'; 
                    b.style.boxShadow = 'var(--neon-white)'; 
                });
            }
        }
    </script>
</body>
</html>
