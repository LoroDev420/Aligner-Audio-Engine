<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aligner // Audio Visualizer Edition</title>
    <style>
        :root {
            --bg: #1A1C23;
            --card-bg: #252833;
            --coral: #DF7366;
            --white: #ffffff;
            --text-sub: #A0A2AB;
            --bar-w: 30px;
            --gap: 8px;
            --shadow-soft: 0 10px 30px rgba(0,0,0,0.4);
            --smooth-curve: cubic-bezier(0.23, 1, 0.32, 1);
        }

        body {
            background: var(--bg);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none; cursor: none !important;
        }

        /* CURSOR CARTOON */
        #custom-cursor {
            position: fixed; width: 28px; height: 28px;
            z-index: 9999999; pointer-events: none !important; 
            left: -50px; top: -50px; transition: none;
        }

        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; pointer-events: none; }
        h1 { font-size: 3.5rem; margin: 0; color: white; letter-spacing: -1.5px; }
        p { color: var(--text-sub); margin: 8px 0 0; font-size: 1.15rem; }

        /* CONTROLES MP3 */
        .action-slot {
            display: flex; align-items: center; justify-content: center;
            gap: 15px; margin-bottom: 50px;
        }

        .btn {
            background: var(--white); color: #000; border: none;
            padding: 12px 30px; border-radius: 25px; font-weight: 700;
            box-shadow: var(--shadow-soft); transition: transform 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .btn:active { transform: scale(0.95); }

        .upload-label { background: var(--white); cursor: none !important; }
        .pause-btn { 
            background: var(--coral); width: 50px; height: 50px; 
            border-radius: 50%; padding: 0; 
        }
        .pause-btn svg { fill: white; width: 20px; }
        input[type="file"] { display: none; }

        /* VISUALIZADOR */
        .stage {
            display: flex; align-items: flex-end; justify-content: center;
            height: 300px; gap: var(--gap);
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .bar {
            width: var(--bar-w); background: var(--white);
            border-radius: 50px; min-height: 10px;
            transition: height 0.08s linear, background-color 0.3s;
            box-shadow: var(--shadow-soft);
        }

        /* BARRA DE PROGRESSO INFERIOR */
        .bottom-bar {
            margin-top: 50px; display: flex; align-items: center; gap: 20px;
            background: var(--card-bg); padding: 12px 30px; border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.1); width: 450px;
        }
        .progress-container { flex: 1; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; position: relative; }
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; background: var(--coral); width: 0%; transition: width 0.1s linear; }
        #time-display { font-family: monospace; font-weight: bold; font-size: 1.1rem; color: white; min-width: 65px; text-align: right; }
    </style>
</head>
<body>

    <!-- Cursor -->
    <div id="custom-cursor">
        <svg viewBox="0 0 24 24" fill="none" width="28" height="28">
            <path d="M4.5 3V17.5L9.2 13.3L13 21L16.5 19.3L12.8 11.7L18.5 11.5L4.5 3Z" 
                  fill="white" stroke="black" stroke-width="2.2" stroke-linejoin="round"/>
        </svg>
    </div>

    <div class="header">
        <h1>Aligner Engine</h1>
        <p>A straightforward and direct audio approach.</p>
    </div>

    <div class="action-slot">
        <label class="btn upload-label">
            Load MP3 <input type="file" id="audio-input" accept="audio/mp3">
        </label>
        
        <button class="btn pause-btn" id="play-pause">
            <svg id="svg-pause" viewBox="0 0 24 24"><path d="M14,19H18V5H14M6,19H10V5H6V19Z"/></svg>
            <svg id="svg-play" viewBox="0 0 24 24" style="display:none;"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"/></svg>
        </button>
    </div>

    <div class="stage" id="stage">
        <!-- 19 barras geradas via JS -->
    </div>

    <div class="bottom-bar">
        <div class="progress-container">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div id="time-display">00:00</div>
    </div>

    <script>
        const audioInput = document.getElementById('audio-input');
        const playPauseBtn = document.getElementById('play-pause');
        const progressFill = document.getElementById('progress-fill');
        const timeDisplay = document.getElementById('time-display');
        const cursor = document.getElementById('custom-cursor');
        const stage = document.getElementById('stage');

        let audio = new Audio();
        let audioCtx, analyser, dataArray, source;
        let isPlaying = false;
        const numBars = 19;
        const bars = [];

        // Inicializa as Barras
        for (let i = 0; i < numBars; i++) {
            const b = document.createElement('div');
            b.className = 'bar';
            stage.appendChild(b);
            bars.push(b);
        }

        // Seguir Mouse
        window.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Carregar MP3
        audioInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const url = URL.createObjectURL(file);
            audio.src = url;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                source = audioCtx.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            
            audio.play();
            isPlaying = true;
            updateIcons();
            draw();
        };

        // Play/Pause
        playPauseBtn.onclick = () => {
            if (!audio.src) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (isPlaying) {
                audio.pause();
            } else {
                audio.play();
                draw();
            }
            isPlaying = !isPlaying;
            updateIcons();
        };

        function updateIcons() {
            document.getElementById('svg-pause').style.display = isPlaying ? 'block' : 'none';
            document.getElementById('svg-play').style.display = isPlaying ? 'none' : 'block';
        }

        function draw() {
            if (!isPlaying) return;
            requestAnimationFrame(draw);

            // Analisa frequências
            analyser.getByteFrequencyData(dataArray);

            for (let i = 0; i < numBars; i++) {
                let val = dataArray[i];
                let h = (val / 255) * 280;
                bars[i].style.height = Math.max(10, h) + 'px';
                
                // Brilha em coral se o volume dessa frequência for alto
                bars[i].style.backgroundColor = val > 200 ? 'var(--coral)' : 'white';
                bars[i].style.boxShadow = val > 200 ? '0 0 20px var(--coral)' : 'var(--shadow-soft)';
            }

            // Atualiza barra de progresso e tempo
            const pct = (audio.currentTime / audio.duration) * 100 || 0;
            progressFill.style.width = pct + "%";
            
            const mins = Math.floor(audio.currentTime / 60);
            const secs = Math.floor(audio.currentTime % 60);
            timeDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
    </script>
</body>
</html>
